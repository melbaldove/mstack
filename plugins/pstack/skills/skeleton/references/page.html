<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton</title>
<style>
:root{color-scheme:light dark;--fg:var(--foreground,#1f2328);--mu:var(--muted-foreground,#5d646c);--cd:var(--card,#fff);--bd:var(--border,#d8d5ce);--cb:var(--code-background,#f3f1ec);--ok:var(--success,#2f7d32);--wa:var(--warning,#9a6a00);--ba:var(--destructive,#b3261e);--ac:var(--info,#2f6fb3);--r:var(--radius,10px);--sans:var(--font-sans,system-ui,sans-serif);--mono:var(--font-mono,ui-monospace,Menlo,monospace)}
@media (prefers-color-scheme:dark){:root{--fg:var(--foreground,#e6e6e3);--mu:var(--muted-foreground,#a0a6ac);--cd:var(--card,#1c1f23);--bd:var(--border,#3a3f45);--cb:var(--code-background,#15171a);--ok:var(--success,#86c285);--wa:var(--warning,#e0b84f);--ba:var(--destructive,#f08a80);--ac:var(--info,#6aa8e8)}}
*{box-sizing:border-box}
body{margin:0;padding:4px 16px 24px;color:var(--fg);font:15px/1.6 var(--sans)}
main{max-width:860px}
h1{font-size:21px;line-height:1.3;margin:0}
.base{font-size:13px;color:var(--mu);margin-top:4px}
.block{margin-top:30px}
.base+.block,h1+.block{margin-top:18px}
h2{font-size:17px;margin:0 0 10px}
p{margin:0 0 8px}
code{font:.88em var(--mono);background:var(--cb);border:1px solid var(--bd);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
ul{margin:0;padding-left:20px}
li{margin:3px 0}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.answer{font-size:17px;line-height:1.55;border-left:4px solid var(--ac);background:var(--cd);border-radius:0 var(--r) var(--r) 0;padding:14px 18px}
.answer p:last-child{margin:0}
.label{font-size:13px;font-weight:650;color:var(--mu);margin:0 0 4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.cols .box.pick{border:2px solid var(--ok)}
.goal{font-size:16px;font-weight:600;margin:0 0 12px}
.never li::marker{color:var(--ba)}
.ask{border:2px solid var(--wa)}
.ask .q{font-size:16px;font-weight:650;margin:0 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--bd)}
th{font-size:13px;color:var(--mu);font-weight:650}
td.picked,th.picked{background:color-mix(in srgb,var(--ok) 12%,transparent)}
tr.changed td,tr.new td{background:color-mix(in srgb,var(--wa) 9%,transparent)}
tr.new td{background:color-mix(in srgb,var(--ok) 9%,transparent)}
td.num{color:var(--mu);width:28px}
.before{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.tag{display:inline-block;font:650 11.5px/1.4 var(--sans);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.changed{color:var(--wa);border:1px solid var(--wa)}
.tag.new{color:var(--ok);border:1px solid var(--ok)}
.tag.never,.tag.broken{color:var(--ba);border:1px solid var(--ba)}
.tag.how{color:var(--mu);border:1px solid var(--bd);font-weight:500}
.concept{padding:18px 18px 16px}
.concept h3{font-size:18px;margin:0}
.concept .purpose{color:var(--mu);margin:2px 0 4px}
.part{margin-top:18px}
.part>.label{font-size:12.5px;letter-spacing:.02em}
pre{margin:0;background:var(--cb);border:1px solid var(--bd);border-radius:6px;padding:9px 12px;font:13px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
pre.changed{border-color:var(--wa);box-shadow:inset 3px 0 0 var(--wa)}
pre.new{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.gloss{margin-top:6px}
.gloss td:first-child{font:13px var(--mono);white-space:nowrap;width:1%}
.fn+.fn{margin-top:12px}
.fn .does{margin-top:6px}
.inv li{margin:6px 0}
dl{margin:0;display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:6px 16px;font-size:14px}
dt{font-weight:650}
dd{margin:0;color:var(--mu)}
@media (max-width:520px){dl{grid-template-columns:1fr;gap:0}dd{margin-bottom:8px}.gloss td:first-child{white-space:normal}}
.sources{font:12.5px/1.7 var(--mono);color:var(--mu);overflow-wrap:anywhere}
.note{border-left:4px solid var(--wa);background:color-mix(in srgb,var(--wa) 10%,transparent);padding:10px 14px;border-radius:0 var(--r) var(--r) 0}
.flow{display:flex;flex-direction:column}
.step{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px}
.step .name{font-weight:650}
.step .detail{color:var(--mu);font-size:14px;margin-top:2px}
.step.changed,.gn.changed{border:2px solid var(--wa);background:color-mix(in srgb,var(--wa) 8%,var(--cd))}
.step.new,.gn.new{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--cd))}
.arrow{align-self:center;color:var(--mu);font-size:18px;line-height:1;padding:3px 0}
.gscroll{overflow-x:auto;padding:4px 0}
.graph{position:relative;margin:0 auto;transform-origin:top left}
.graph svg{position:absolute;left:0;top:0;overflow:visible}
.gn{position:absolute;width:max-content;max-width:220px;background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font-size:13.5px;line-height:1.45}
.gn .t{font-weight:650}
.gn .sig{font:11.5px/1.45 var(--mono);color:var(--mu);margin-top:3px;overflow-wrap:anywhere}
.gn .d{color:var(--mu);font-size:12.5px;margin-top:3px}
.gn.actor{border-radius:999px;padding:7px 16px}
.gn.outside{border-style:dashed}
.gn.store{border-width:1px 1px 4px;border-style:solid solid double}
.gn.state{border-radius:999px;padding:6px 14px;text-align:center}
.gn.state.end{border-width:2px}
.gn.refused{border-color:var(--ba);color:var(--ba)}
.gl{position:absolute;max-width:170px;width:max-content;font-size:12px;line-height:1.35;color:var(--mu);background:var(--cd);padding:1px 4px;border-radius:4px}
.gl.never{color:var(--ba)}
.edge{fill:none;stroke:var(--mu);stroke-width:1.4}
.edge.never{stroke:var(--ba);stroke-dasharray:5 4}
.legend{font-size:12.5px;color:var(--mu);margin-top:8px}
.fallback .gn,.fallback .gl{position:static;display:inline-block;margin:4px}
figure{margin:0}
figure svg{max-width:100%;height:auto}
</style>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
</head>
<body>
<main id="page"></main>

<script id="skeleton-data" type="application/json">
{
  "title": "Ticket resale at face value",
  "base": "Design · new service",
  "blocks": [
    { "type": "answer", "text": "A fan sells a ticket they can't use to another fan, at face value or less. The buyer's card is held, the ticket moves, and only then is the card charged, so nobody pays for a ticket they don't get. One question is open: when the seller gets paid." },
    { "type": "intent", "goal": "A fan who can't go sells their ticket to another fan for no more than face value, and neither loses money or ends up with a ticket that doesn't work.", "done": ["The buyer holds a valid ticket in their name.", "The seller is paid."], "never": ["A ticket sold twice.", "A buyer charged without the ticket.", "A price above face value.", "A buyer out of pocket when an event is cancelled."], "out": ["First-hand sales, auctions, changing prices."] },
    { "type": "decision", "question": "When is the seller paid?", "why": "The ticket company can cancel a ticket after it is sold, and someone has to absorb that.", "options": ["After the event", "At transfer"], "pick": 0, "reason": "A ticket can be cancelled any time before the event, and only this keeps every buyer whole.", "measures": [{ "label": "Who absorbs a cancelled ticket", "values": ["The seller", "Us"] }, { "label": "How long a seller waits", "values": ["Until the event", "Minutes"] }] },
    { "type": "graph", "title": "Who calls what", "nodes": [
      { "id": "buyer", "label": "Buyer", "kind": "actor" },
      { "id": "complete", "label": "completePurchase", "signature": "completePurchase(holdId): Result<Sale, \"expired\" | \"transfer_rejected\">", "does": "Moves the ticket, then charges or releases the card.", "mark": "new" },
      { "id": "issuer", "label": "Ticket company API", "kind": "outside", "does": "Owns who holds each ticket." },
      { "id": "pay", "label": "Payment provider", "kind": "outside", "does": "Holds, charges and releases cards." },
      { "id": "db", "label": "Database", "kind": "store", "does": "Listings, holds, payments." }
    ], "edges": [
      { "from": "buyer", "to": "complete", "label": "presses Buy" },
      { "from": "complete", "to": "issuer", "label": "transfer ticket" },
      { "from": "complete", "to": "pay", "label": "charge or release" },
      { "from": "complete", "to": "db" }
    ] },
    { "type": "concept", "name": "Payment", "mark": "new", "purpose": "The buyer's money, which moves only if the ticket does.",
      "types": [{ "code": "type Payment = {\n  id: PaymentId\n  holdId: HoldId\n  amount: Price\n  status: \"held\" | \"charged\" | \"released\"\n}", "notes": [
        { "name": "amount", "means": "A Price can only be built at or below face value, so an overpriced payment cannot exist." },
        { "name": "status", "means": "Where the money is. See the state machine below." }
      ] }],
      "functions": [{ "signature": "completePurchase(holdId: HoldId): Result<Sale, \"expired\" | \"transfer_rejected\">", "does": "Asks the ticket company to move the ticket. Charges the hold if it moved, releases it if not." }],
      "machine": {
        "states": [{ "id": "held", "label": "held" }, { "id": "charged", "label": "charged", "end": true }, { "id": "released", "label": "released", "end": true }],
        "transitions": [
          { "from": "held", "to": "charged", "when": "the ticket moved" },
          { "from": "held", "to": "released", "when": "transfer failed, hold expired, or event cancelled" },
          { "from": "released", "to": "charged", "when": "never: charge after release", "never": true }
        ]
      },
      "invariants": [
        { "text": "Charged only for a ticket that moved.", "enforced": "test", "where": "purchase.test.ts" },
        { "text": "A crash after the transfer still ends charged.", "enforced": "repair job" }
      ],
      "constraints": ["Card holds expire after about 7 days."] },
    { "type": "terms", "items": [
      { "term": "Hold", "means": "Money reserved on the buyer's card but not yet taken." },
      { "term": "Face value", "means": "The price printed on the ticket." }
    ] }
  ]
}
</script>

<script>
const D = JSON.parse(document.getElementById('skeleton-data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const paras = s => String(s ?? '').split(/\n\s*\n/).map(p => `<p>${md(p)}</p>`).join('');
const list = (items, cls = '') => items && items.length ? `<ul class="${cls}">${items.map(i => `<li>${md(i)}</li>`).join('')}</ul>` : '';
const MARK = { new: 'New', changed: 'Changed' };
const tag = (kind, text) => kind ? `<span class="tag ${kind}">${esc(text ?? MARK[kind] ?? kind)}</span>` : '';
const heading = (b, fallback) => (b.title ?? fallback) ? `<h2>${md(b.title ?? fallback)}</h2>` : '';
const before = x => x.before ? `<span class="before">Before: ${md(x.before)}</span>` : '';
const part = (label, html) => html ? `<div class="part"><p class="label">${label}</p>${html}</div>` : '';
const graphs = [];
const graphSlot = (g, legend) => { graphs.push(g); return `<div class="gscroll"><div class="graph" data-g="${graphs.length - 1}"></div></div>${legend || ''}`; };
const KIND_NOTE = { actor: 'Rounded: a person', outside: 'Dashed: a system outside ours', store: 'Double bottom line: stored data' };
const legendFor = nodes => { const kinds = [...new Set(nodes.map(n => n.kind).filter(k => KIND_NOTE[k]))]; const marks = [...new Set(nodes.map(n => n.mark).filter(Boolean))]; const bits = kinds.map(k => KIND_NOTE[k]).concat(marks.map(m => m === 'changed' ? 'Amber: changed by this work' : 'Green: added by this work')); return bits.length ? `<p class="legend">${bits.join(' · ')}</p>` : ''; };

const typeHtml = t => { const x = typeof t === 'string' ? { code: t } : t; return `<pre class="${x.mark || ''}">${esc(x.code)}</pre>${x.mark ? tag(x.mark) : ''}${before(x)}${x.notes && x.notes.length ? `<table class="gloss"><tbody>${x.notes.map(n => `<tr class="${n.mark || ''}"><td>${esc(n.name)}</td><td>${md(n.means)}${tag(n.mark)}${before(n)}</td></tr>`).join('')}</tbody></table>` : ''}`; };
const fnHtml = f => `<div class="fn"><pre class="${f.mark || ''}">${esc(f.signature)}</pre><div class="does">${md(f.does)}${tag(f.mark)}${before(f)}</div></div>`;
const rulesHtml = r => `${r.order ? `<p>${md(r.order)}</p>` : ''}<table><thead><tr><th></th><th>If</th><th>Then</th></tr></thead><tbody>${r.rows.map((x, i) => `<tr class="${x.mark || ''}"><td class="num">${i + 1}</td><td>${md(x.if)}</td><td>${md(x.then)}${tag(x.mark)}${before(x)}</td></tr>`).join('')}</tbody></table>`;
const machineGraph = m => ({ nodes: m.states.map(s => ({ id: s.id, label: s.label, does: s.means, kind: 'state', end: s.end, refused: s.refused, mark: s.mark })), edges: m.transitions.map(t => ({ from: t.from, to: t.to, label: t.when, never: t.never, mark: t.mark })) });
const neverLegend = m => m.transitions.some(t => t.never) ? '<p class="legend">Dashed red: a transition that must never happen · Thick border: a final state</p>' : '<p class="legend">Thick border: a final state</p>';
const invHtml = v => `<ul class="inv">${v.map(i => `<li>${md(i.text)}${tag('how', 'enforced by ' + (i.enforced || 'nothing'))}${i.broken ? tag('broken', 'Broken today') : ''}${tag(i.mark)}${i.where ? `<span class="before">${md(i.where)}</span>` : ''}</li>`).join('')}</ul>`;

const R = {
  answer: b => `<section class="answer">${paras(b.text)}</section>`,
  note: b => `${heading(b)}<section class="note">${paras(b.text)}</section>`,
  intent: b => `${heading(b, 'Intent')}<section class="box"><p class="goal">${md(b.goal)}</p><div class="cols">${[['Done means', b.done], ['Never', b.never, 'never'], ['Out of scope', b.out]].filter(([, v]) => v && v.length).map(([l, v, c]) => `<div><p class="label">${l}</p>${list(v, c)}</div>`).join('')}</div></section>`,
  compare: b => `${heading(b)}<div class="cols">${b.columns.map((c, i) => `<section class="box ${b.pick === i ? 'pick' : ''}"><p class="label">${md(c.label)}</p>${list(c.items)}</section>`).join('')}</div>`,
  decision: b => `${heading(b, 'Open question')}<section class="box ask"><p class="q">${md(b.question)}</p>${b.why ? `<p>${md(b.why)}</p>` : ''}<p><b>Pick: ${md(b.options[b.pick])}.</b> ${md(b.reason)}</p>${b.measures && b.measures.length ? `<table><thead><tr><th></th>${b.options.map((o, i) => `<th class="${i === b.pick ? 'picked' : ''}">${md(o)}</th>`).join('')}</tr></thead><tbody>${b.measures.map(m => `<tr><td>${md(m.label)}</td>${m.values.map((v, i) => `<td class="${i === b.pick ? 'picked' : ''}">${md(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>` : ''}</section>`,
  flow: b => `${heading(b)}<div class="flow">${b.steps.map(s => `<div class="step ${s.mark || ''}"><div class="name">${md(s.label)}${tag(s.mark)}</div>${s.detail ? `<div class="detail">${md(s.detail)}</div>` : ''}</div>`).join('<div class="arrow" aria-hidden="true">↓</div>')}</div>`,
  graph: b => `${heading(b)}<section class="box">${graphSlot(b, legendFor(b.nodes))}</section>`,
  machine: b => `${heading(b)}<section class="box">${graphSlot(machineGraph(b), neverLegend(b))}</section>`,
  rules: b => `${heading(b)}<section class="box">${rulesHtml(b)}</section>`,
  concept: b => `${heading(b)}<section class="box concept"><h3>${md(b.name)}${tag(b.mark)}</h3><p class="purpose">${md(b.purpose)}</p>${
    part('Types', b.types && b.types.length && b.types.map(typeHtml).join('<div style="height:10px"></div>'))}${
    part('Functions', b.functions && b.functions.length && b.functions.map(fnHtml).join(''))}${
    part(b.rules && b.rules.title || 'Rules', b.rules && rulesHtml(b.rules))}${
    part('State machine', b.machine && graphSlot(machineGraph(b.machine), neverLegend(b.machine)))}${
    part('Always true', b.invariants && b.invariants.length && invHtml(b.invariants))}${
    part('Constraints', b.constraints && b.constraints.length && list(b.constraints))}</section>`,
  findings: b => `${heading(b, 'Findings')}<section class="box"><ul>${b.items.map(f => `<li>${md(f.text)}${f.fix ? `<span class="before">Fix: ${md(f.fix)}</span>` : ''}</li>`).join('')}</ul></section>`,
  terms: b => `${heading(b, 'Terms')}<section class="box"><dl>${b.items.map(t => `<dt>${md(t.term)}</dt><dd>${md(t.means)}</dd>`).join('')}</dl></section>`,
  sources: b => `${heading(b, 'Sources')}<div class="sources">${b.items.map(md).join('<br>')}</div>`,
  svg: b => { const t = document.getElementById(b.ref); return `${heading(b)}<figure class="box">${t ? t.innerHTML : ''}</figure>`; },
};

const nodeHtml = n => `<div class="t">${md(n.label)}${tag(n.mark)}</div>${n.signature ? `<div class="sig">${esc(n.signature)}</div>` : ''}${n.does ? `<div class="d">${md(n.does)}</div>` : ''}`;
const ELK_OPTIONS = { 'elk.algorithm': 'layered', 'elk.direction': 'DOWN', 'elk.edgeRouting': 'ORTHOGONAL', 'elk.spacing.nodeNode': '26', 'elk.layered.spacing.nodeNodeBetweenLayers': '34', 'elk.spacing.edgeLabel': '4', 'elk.layered.spacing.edgeNodeBetweenLayers': '14', 'elk.layered.nodePlacement.strategy': 'NETWORK_SIMPLEX', 'elk.padding': '[top=6,left=6,bottom=6,right=6]' };

const MIN_SCALE = 0.72;
const fitGraph = (host, layout) => {
  const room = host.parentElement.clientWidth;
  if (layout.width <= room) return;
  const scale = Math.max(room / layout.width, MIN_SCALE);
  host.style.transform = `scale(${scale})`;
  host.style.margin = '0';
  host.parentElement.style.height = layout.height * scale + 8 + 'px';
};

async function drawGraph(host, g) {
  const nodeEls = {};
  for (const n of g.nodes) {
    const el = document.createElement('div');
    el.className = ['gn', n.kind, n.mark, n.end && 'end', n.refused && 'refused'].filter(Boolean).join(' ');
    el.innerHTML = nodeHtml(n);
    host.appendChild(el);
    nodeEls[n.id] = el;
  }
  const labelEls = g.edges.map(e => {
    if (!e.label) return null;
    const el = document.createElement('div');
    el.className = 'gl' + (e.never ? ' never' : '');
    el.innerHTML = md(e.label);
    host.appendChild(el);
    return el;
  });
  if (!window.ELK) {
    host.classList.add('fallback');
    host.insertAdjacentHTML('beforeend', `<ul>${g.edges.map(e => `<li>${md(g.nodes.find(n => n.id === e.from).label)} → ${md(g.nodes.find(n => n.id === e.to).label)}${e.label ? ': ' + md(e.label) : ''}</li>`).join('')}</ul>`);
    labelEls.forEach(l => l && l.remove());
    return;
  }
  const layout = await new ELK().layout({
    id: 'root', layoutOptions: ELK_OPTIONS,
    children: g.nodes.map(n => ({ id: n.id, width: nodeEls[n.id].offsetWidth, height: nodeEls[n.id].offsetHeight })),
    edges: g.edges.map((e, i) => ({ id: 'e' + i, sources: [e.from], targets: [e.to], labels: labelEls[i] ? [{ id: 'l' + i, text: e.label, width: labelEls[i].offsetWidth, height: labelEls[i].offsetHeight }] : [] })),
  });
  host.style.width = layout.width + 'px';
  host.style.height = layout.height + 'px';
  fitGraph(host, layout);
  for (const c of layout.children) Object.assign(nodeEls[c.id].style, { left: c.x + 'px', top: c.y + 'px' });
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', layout.width);
  svg.setAttribute('height', layout.height);
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--mu)"/></marker><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ba)"/></marker></defs>';
  layout.edges.forEach((e, i) => {
    const never = g.edges[i].never;
    for (const s of e.sections || []) {
      const pts = [s.startPoint, ...(s.bendPoints || []), s.endPoint];
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', pts.map((p, k) => (k ? 'L' : 'M') + p.x + ',' + p.y).join(''));
      path.setAttribute('class', 'edge' + (never ? ' never' : ''));
      path.setAttribute('marker-end', never ? 'url(#ahn)' : 'url(#ah)');
      svg.appendChild(path);
    }
    for (const l of e.labels || []) Object.assign(labelEls[i].style, { left: l.x + 'px', top: l.y + 'px' });
  });
  host.prepend(svg);
}

document.title = D.title;
document.getElementById('page').innerHTML = `<h1>${md(D.title)}</h1>${D.base ? `<div class="base">${md(D.base)}</div>` : ''}` + D.blocks.map(b => R[b.type] ? `<div class="block">${R[b.type](b)}</div>` : '').join('');
document.querySelectorAll('.graph').forEach(el => drawGraph(el, graphs[Number(el.dataset.g)]));
</script>
</body>
</html>

name: mstack sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Rebuild from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/michael-denyer/pstack-claude.git
          mstack/sync.sh
      - name: Check generated files and tests
        run: |
          bun tools/generate.mjs --check
          bun test tests/
      - name: Commit
        id: commit
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync to pstack-claude $(cut -c1-7 mstack/UPSTREAM)"
          git bundle create sync.bundle origin/main..HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync
          path: sync.bundle
          retention-days: 7

  push:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync
      - name: Push the sync branch
        run: |
          git fetch sync.bundle HEAD:refs/heads/mstack-sync
          git push --force origin mstack-sync
      - name: Ask for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          title="$(git log -1 --format=%s mstack-sync)"
          body="Review the upstream changes before they reach your agents, then merge. The startup hooks run shell commands in every session."
          if [ -n "$(gh pr list --head mstack-sync --state open --json number --jq '.[].number')" ]; then
            exit 0
          fi
          if gh pr create --base main --head mstack-sync --title "$title" --body "$body"; then
            exit 0
          fi
          compare="$SERVER_URL/$GH_REPO/compare/main...mstack-sync"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "$body Actions cannot open pull requests in this repository, so open one from $compare."
          fi

  report:
    needs: [build, push]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="mstack sync failed"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "The weekly rebuild from pstack-claude failed: $RUN_URL. Run mstack/sync.sh locally, resolve the patch conflict, run mstack/save-patch.sh, and push."
          fi
